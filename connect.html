<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Conectando...</title>

  <style>
    body {
      margin: 0;
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      text-align: center;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 20px;
      opacity: 0.9;
    }

    /* LOADING SPINNER */
    .loader {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top: 3px solid #fff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .btn {
      margin-top: 10px;
      padding: 10px 18px;
      background: transparent;
      color: white;
      border: 1px solid #fff;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: 0.2s;
    }

    .btn:hover {
      background: white;
      color: black;
    }

    p {
      font-size: 13px;
      opacity: 0.6;
      margin-top: 15px;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="loader"></div>

    <h1>Conectando ao servidor...</h1>

    <button class="btn" onclick="connect()">
      Conectar manualmente
    </button>

    <p>Se nada acontecer, clique no botão acima</p>
  </div>

  <script>
    function connect() {
      window.location.href = "steam://connect/80.75.221.5:28006";
    }

    setTimeout(connect, 1500);
  </script>
</body>
</html>
